name: torch-env
channels:
  - conda-forge

# Conda installs only python + pip. Everything else (including torch) comes
# from pip so we get fresh wheels.
# macOS arm64 build; torch wheels include MPS support by default.
#
# No conda BLAS here, unlike the linux spec: numpy >=2.0 and scipy >=1.14 ship
# separate macOS >=14 arm64 wheels linked against Apple's Accelerate framework
# rather than vendoring OpenBLAS, and torch/sklearn carry their own libomp. A
# conda openblas was therefore ~14MB that nothing ever loaded -- verified with
# scripts/check_native_libs.py, which now runs in CI on both platforms.
dependencies:
  - python=3.13
  - pip

  - pip:
      - h5py
      - hydra-core
      - imageio
      - ipykernel
      - ipython
      - joblib
      - jupyter
      - matplotlib
      - mlflow
      - neuroglancer
      - numpy
      - opencv-python
      - pandas
      - Pillow
      - polars
      - pre-commit
      - pydantic
      - pysr
      - pytest
      - pyyaml
      - rerun-sdk
      - ruff
      - scikit-image
      - scikit-learn
      - scipy
      - seaborn
      - tensorstore
      - tifffile
      - torch
      - torch-geometric
      - torchdiffeq
      - torchvision
      - tqdm
      - tyro
      - umap-learn
      - warp-lang
      - xarray
      - zarr
